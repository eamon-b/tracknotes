name = "tracknotes-comments"
main = "src/index.ts"
compatibility_date = "2025-04-01"

# Public hostname: https://api.tracknotes.info (zone: tracknotes.info).
# Deploy with: npm run deploy (requires `wrangler login`).
#
# The custom domain is the only hostname: the workers.dev URL was retired
# (issue #159), and api.contour-map-tiles.net, the old infrastructure name, was
# removed once the maintainer's phone ran a build calling api.tracknotes.info
# (#269). Builds older than that can no longer reach the API.
workers_dev = false

[[routes]]
pattern = "api.tracknotes.info"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "tracknotes-comments"
database_id = "7ebd1642-b752-4184-904e-54bfa48b658f"

# Photo attachments live in R2, in the app's own bucket (trail data and offline
# packs too; the public contour dataset keeps `aus-map-data`). Photos go under
# the `comments/` prefix and are read publicly via PHOTOS_PUBLIC_BASE.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "tracknotes-data"

# Community-route maintenance (`runCommunityMaintenance` in src/community.ts):
# retries de-attributions an account deletion left pending, re-runs AI
# reviews stuck at `pending`, and fetches OSM POIs for routes that have none
# yet (`enrichCommunityRoutePois`), a bounded batch each run.
[triggers]
crons = ["*/15 * * * *"]

# Workers AI: the Llama Guard screen of every new comment and shared waypoint
# (`src/content-review.ts`), and the AI Gateway URL the Anthropic calls take.
[ai]
binding = "AI"
# Always remote (Workers AI has no local model); tests turn remote bindings off.
remote = true

[vars]
# Public read base for R2 objects: the bucket's custom domain (the old
# pub-….r2.dev URL still resolves but is rate-limited and uncached). The worker
# returns full URLs built from this + the object key. Tests override it.
# Comment photos store those full URLs in `comments.photo_urls_json`, so a
# change here leaves already-attached photos on the old host: the bucket keeps
# data.contour-map-tiles.net (the public contour dataset's address) as well.
PHOTOS_PUBLIC_BASE = "https://data.tracknotes.info"

# Origin of the deployed web site: the Vercel deploy at tracknotes.info (moved
# from trail-maps.vercel.app). Share links are built as
# `SITE_BASE/shared-plan.html?s=<shareId>`, so this must change the day the site
# moves or every link minted after the move is dead. Tests override it.
SITE_BASE = "https://tracknotes.info"

# Overpass instances the community-route POI enrichment asks, in order
# (comma-separated https URLs; `src/community-pois.ts`). Each query goes to the
# instance that answered last, then the next one on a failure. EMPTY = OFF.
# It is on: the account is on Workers Paid (2026-10-20), whose 15-minute cron
# CPU limit covers the enrichment's tens to hundreds of ms per route; on Workers
# Free (10 ms) it would have to be switched off again
# (docs/architecture/workers.md, "community route POIs"). Every instance listed receives each live
# community route's outline: name its operator in docs/privacy-policy.md and
# public/privacy.html before adding one (both list the three above).
# Mirrors come and go: see docs/architecture/build-scripts.md (fetch-pois).
OVERPASS_ENDPOINTS = "https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter,https://overpass.kumi.systems/api/interpreter"

# The Cloudflare AI Gateway every model call goes through (Anthropic and Workers
# AI): request logs, spend and rate limits. EMPTY = OFF (calls go straight to
# the provider). Create the gateway first (dashboard: AI → AI Gateway), then
# put its name here; an Authenticated Gateway (the auto-created `default` one
# is) also needs the AI_GATEWAY_TOKEN secret below, or every review fails.
# Steps: docs/architecture/workers.md ("Comment and waypoint review").
AI_GATEWAY_ID = ""

# Secrets (not in this file): set with `wrangler secret put <NAME>`.
#   ANTHROPIC_API_KEY — the community-route AI review (src/community-review.ts)
#     and the review of reported or screen-flagged comments and shared waypoints
#     (src/content-review.ts). `wrangler secret put ANTHROPIC_API_KEY`.
#     Optional: without it every route review is recorded as `skipped` and
#     routes stay Unverified until an admin looks, and comments and waypoints
#     are neither screened nor reviewed (three reports still hide one).
#   AI_GATEWAY_TOKEN — only if the gateway is an Authenticated Gateway.

# ---------------------------------------------------------------------------
# STAGING: a second copy of this Worker for testing a branch end to end
# (`npm run migrate:staging && npm run deploy:staging`; the Staging comments
# API workflow deploys same-repo PRs here). Its own D1 and R2, so nothing it
# does reaches production data. It holds TEST DATA ONLY, it is shared by every
# branch (last deploy wins), and anyone may wipe it.
# docs/architecture/workers.md ("Staging").
#
# Wrangler environments do NOT inherit bindings or [vars], so every one is
# redeclared below. They DO inherit `routes`, `workers_dev` and `triggers`,
# which is why each is set here: without `routes = []` a staging deploy would
# claim api.tracknotes.info, and without `crons = []` it would run the
# production cron. Tests read only the top-level config above.
# ---------------------------------------------------------------------------
[env.staging]
name = "tracknotes-comments-staging"
# No custom domain: https://tracknotes-comments-staging.<account subdomain>.workers.dev
workers_dev = true
routes = []

# No cron by default: the */15 maintenance re-runs AI reviews (our spend) and
# sends live community routes' outlines to the Overpass operators (off anyway
# while OVERPASS_ENDPOINTS is empty). To test `scheduled`, add a cron here on
# your branch, deploy, and take it out again.
[env.staging.triggers]
crons = []

# Created 2026-11-11 with `wrangler d1 create tracknotes-comments-staging
# --location oc` (placed in OC).
[[env.staging.d1_databases]]
binding = "DB"
database_name = "tracknotes-comments-staging"
database_id = "63ed471c-5233-4318-9ff5-f30acd38bd04"

# `wrangler r2 bucket create tracknotes-data-staging --location oc`
[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "tracknotes-data-staging"

# Workers AI: Llama Guard runs only when ANTHROPIC_API_KEY is set (it screens
# for the review that key pays for), so without that secret on staging this
# binding is never called and costs nothing. With it, every new comment with
# text and every waypoint create or edit is a billed Llama Guard request, and
# each review a billed Anthropic call, as in production.
[env.staging.ai]
binding = "AI"
remote = true

[env.staging.vars]
# The staging bucket's public read URL (photos and community-route JSON). A new
# bucket has none: `wrangler r2 bucket dev-url enable tracknotes-data-staging`
# (or dashboard: R2 → the bucket → Settings → Public Development URL), then put
# the https://pub-<hash>.r2.dev it prints here. r2.dev is rate-limited and
# uncached, which is fine for test traffic; it is on no zone of ours, so no zone
# rule (CSAM scanning included) covers it — staging photos are test images only.
# Give the bucket a CORS rule (GET/HEAD, any origin): the web fetches a
# community route's JSON from here cross-origin.
PHOTOS_PUBLIC_BASE = "https://REPLACE-AFTER-r2-dev-url-enable.invalid"

# Shared-plan links are minted as SITE_BASE/shared-plan.html?s=<id>, and that
# page reads the share from the API its own build was given. A link to
# tracknotes.info would ask production for a staging share and show "not
# found", so the origin must be a site built with VITE_API_BASE_URL = this
# Worker: any Vercel Preview deployment (Preview's VITE_API_BASE_URL is this
# Worker, so every preview reads every staging share). Previews have
# per-deploy URLs, so the Staging workflow passes `--var SITE_BASE:<origin>`
# when the staging environment variable STAGING_SITE_BASE is set (a branch alias, or a
# domain assigned to Preview). Without it, links point at this never-resolving
# placeholder, deliberately not at production: everything else works, and a
# tester swaps the host for any preview's (<preview>/shared-plan.html?s=<id>).
SITE_BASE = "https://set-STAGING_SITE_BASE-to-a-preview-origin.invalid"

# OFF on staging: every instance listed receives each live route's outline
# (third parties, named in the privacy policy), and there is no cron to run it.
OVERPASS_ENDPOINTS = ""

# OFF: staging model calls (only with ANTHROPIC_API_KEY set) go straight to the
# provider, so they stay out of production's gateway logs and spend.
AI_GATEWAY_ID = ""

# Secrets are per environment too: `wrangler secret put <NAME> --env staging`.
# None is required. ANTHROPIC_API_KEY only to test the AI reviews (it costs);
# AI_GATEWAY_TOKEN only with an Authenticated Gateway in AI_GATEWAY_ID.
