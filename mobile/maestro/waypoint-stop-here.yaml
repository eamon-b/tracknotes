appId: com.tracknotes.app
---
# Waypoint detail's plan and map actions — List pane → a campsite → "Stop here"
# round-trip (the plans store, through `toggleStop`), then "Show on map" back
# to the guide's Map pane.
#
# Deepdene Campsite (km 15.8) is the first campsite on the Cape to Cape and is
# not a trail end, so the ⛺ toggle renders. The toggle is a glyph; its words
# are the accessibility label ("Stop here" / "Remove stop"). Asserts no day or
# km figures, which move with the calculators.
- runFlow: shared/launch-dev.yaml
- runFlow: shared/open-cape-to-cape.yaml

# Datasheet pane; rows are buttons labelled "Open <waypoint name>".
- tapOn: "List"
- extendedWaitUntil:
    visible: "Cape Leeuwin Lighthouse"
    timeout: 20000
# The label carries an off-trail suffix when the place is off the line
# (Deepdene is: "Open Deepdene Campsite, 210 m off trail"), and Maestro matches
# the whole string, hence the trailing ".*".
- scrollUntilVisible:
    element:
      text: "Open Deepdene Campsite.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Open Deepdene Campsite.*"
- waitForAnimationToEnd

# --- Stop here round-trip ----------------------------------------------------
- extendedWaitUntil:
    visible: "Stop here"
    timeout: 20000
- tapOn: "Stop here"
- extendedWaitUntil:
    visible: "Remove stop"
    timeout: 10000
- tapOn: "Remove stop"
- extendedWaitUntil:
    visible: "Stop here"
    timeout: 10000

# --- Show on map ---------------------------------------------------------------
# Dismisses to the guide and selects its Map pane. All three panes stay mounted
# (README "Known caveats"), so map chrome such as "Map key" proves nothing; the
# segmented control's selected tab does. The flow reached the waypoint from the
# List pane, so List was selected before the tap.
- scrollUntilVisible:
    element:
      text: "Show on map"
    direction: DOWN
    timeout: 20000
- tapOn: "Show on map"
- extendedWaitUntil:
    visible:
      selected: true
      containsChild: "Map"
    timeout: 20000
- assertNotVisible:
    selected: true
    containsChild: "List"
# The waypoint screen was dismissed, not left on top of the guide.
- assertNotVisible: "Show on map"
