appId: com.tracknotes.app
---
# Today — the planned day dated today (`app/guide/[trailId]/today.tsx`).
#
# The guide header's "Today's plan" button (`TodayHeaderButton`) only renders
# while the plan has a day dated today, so the flow first makes one: it ticks
# Deepdene Campsite on the planner's Stops list (Day 1 = start → Deepdene) and
# types today's date into the plan settings sheet's "Start date" field. Then
# it opens Today from the guide header and checks Day 1 is shown, waypoint by
# waypoint, ending at the night's stop ("Tonight").
#
# Today's date comes from `shared/today-iso.js`, run on the host: the host and
# the emulator must be on the same local date (see the README).
- runFlow: shared/launch-dev.yaml
- runFlow: shared/open-cape-to-cape.yaml
- runScript: shared/today-iso.js

# A fresh install has no plan, so the header has no Today button yet; the
# planner is the way in.
- tapOn: "Plan"
- extendedWaitUntil:
    visible: "Day splits"
    timeout: 15000

# --- One stop -------------------------------------------------------------------
# Deepdene Campsite (km 15.8) is the first campsite; ticking it makes Day 1 a
# planned day (a day in the "not planned yet" tail never counts as today).
- scrollUntilVisible:
    element:
      text: "Stops"
    direction: DOWN
    timeout: 20000
- tapOn: "Deepdene Campsite"
- scrollUntilVisible:
    element:
      text: "Day splits"
    direction: UP
    timeout: 20000
- assertVisible: "Day 2"

# --- Start date = today -----------------------------------------------------------
- tapOn: "Plan settings"
- extendedWaitUntil:
    visible: "Close plan settings"
    timeout: 15000
# The row's "Start date" label and the field share an accessible name, so the
# field is selected by its testID (`PlanHeaderCard`).
- tapOn:
    id: "plan-start-date"
- inputText: ${output.todayIso}
# The field commits as soon as the text is a real date; closing the keyboard
# blurs it, which commits again (a no-op).
- hideKeyboard
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Day splits"
    timeout: 10000
# The summary row now reads "Starts <date> · … pace · … h/day".
- assertVisible: "Starts ${output.todayIso}.*"

# --- Today, from the guide header --------------------------------------------------
- pressKey: back
- extendedWaitUntil:
    visible: "Elevation"
    timeout: 15000
- extendedWaitUntil:
    visible: "Today's plan"
    timeout: 15000
- tapOn: "Today's plan"

# `DayWaypointList`: the summary card's lead is "Day N · <date>", the first row
# is led "Start" and the night's stop "Tonight".
- extendedWaitUntil:
    visible: "Day 1 · ${output.todayIso}"
    timeout: 20000
- assertVisible: "Start"
- scrollUntilVisible:
    element:
      text: "Tonight"
    direction: DOWN
    timeout: 20000
- assertVisible: "Deepdene Campsite"
- takeScreenshot: today

# Back returns to the guide shell.
- pressKey: back
- extendedWaitUntil:
    visible: "Elevation"
    timeout: 15000
