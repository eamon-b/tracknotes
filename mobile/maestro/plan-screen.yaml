appId: com.tracknotes.app
---
# Plan screen — the live per-trail planner reached from a guide's header.
# Opens a guide, taps the "Plan" header action, opens the plan settings sheet,
# and verifies the inputs, summary, and day splits render and survive a
# pace-driven recompute.
#
# The inputs (section, daily hours, pace) live in `PlanSettingsSheet`, a modal
# that stays closed until "Plan settings" is tapped — both the header ⚙ and the
# summary row at the top of the screen carry that accessibility label.
#
# Asserts only on stable text: the input labels, pace control, summary
# labels, "Day 1", the three section headers, and the resupply picker's chips. Deliberately avoids specific
# km values, waypoint names, and day-card footer text (all in flux).
- runFlow: shared/launch-dev.yaml

- runFlow: shared/open-cape-to-cape.yaml

# Open the planner from the header action (icon-only — selected by its
# accessibilityLabel "Plan").
- tapOn: "Plan"

# The screen opens on the summary and the days, not the inputs.
- extendedWaitUntil:
    visible: "Day splits"
    timeout: 15000
# Live summary renders (full trail is the default, valid section).
- assertVisible: "Days"
- assertVisible: "Day 1"

# Open the settings sheet: section controls, daily-hours stepper, pace control.
- tapOn: "Plan settings"
# The sheet's "Done" button is labelled "Close plan settings" (as is its
# backdrop); neither exists until the sheet is open.
- extendedWaitUntil:
    visible: "Close plan settings"
    timeout: 15000
# The sheet is a ScrollView capped at 90% of the screen, with the name and
# start date above the inputs and pace last, so scroll each row into view.
- scrollUntilVisible:
    element:
      text: "Daily hours"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Fast"
    direction: DOWN
    timeout: 15000
- assertVisible: "Pace"

# Change pace, close the sheet (the modal's onRequestClose), and confirm the
# plan recomputed without crashing.
- tapOn: "Fast"
- pressKey: back
- extendedWaitUntil:
    visible: "Day splits"
    timeout: 10000
- assertVisible: ".*Fast pace.*"
- assertVisible: "Day 1"

# The remaining sections live further down the scroll view.
- scrollUntilVisible:
    element:
      text: "Water carries"
    direction: DOWN
    timeout: 20000

# The resupply picker opens as a modal with the selection controls. Cape to
# Cape has three options, so the chip renders. Asserts only on the chip labels
# — waypoint names are data in flux.
- tapOn: "Choose stops"
- extendedWaitUntil:
    visible: "All"
    timeout: 15000
- assertVisible: "Reset"
- pressKey: back

# Back returns to the guide shell.
- pressKey: back
- extendedWaitUntil:
    visible: "Elevation"
    timeout: 15000
