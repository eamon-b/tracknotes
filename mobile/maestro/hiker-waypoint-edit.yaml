appId: com.tracknotes.app
---
# Hiker waypoint add / edit / delete (`app/guide/[trailId]/waypoint-edit.tsx`).
#
# Map ＋ button ("Add a waypoint") → the New waypoint form → name, type and a
# position from "Use my location" → Save; the waypoint then lists in the List
# pane like any other, its screen's "Edit waypoint" reopens the form, a rename
# is saved, and the form's "Delete waypoint" removes it, so the flow leaves no
# state behind (clearState would wipe it anyway).
#
# Position: the ＋ button adds at the GPS fix, and GPS is opt-in, so the form
# opens with none. The flow mocks the emulator's location onto the track
# (Maestro `setLocation`, a point at km 20.1), taps "Use my location" (which
# starts GPS and raises the OS permission prompt), allows it, and taps again
# once a fix is in. A long-press would avoid GPS, but where it lands depends
# on the camera, and a spot more than 5 km from the line cannot be saved.
#
# The waypoint is private ("Only me", the default), so nothing reaches the
# comments API and no display name is asked for.
- runFlow: shared/launch-dev.yaml
- runFlow: shared/open-cape-to-cape.yaml

- setLocation:
    latitude: -34.24883
    longitude: 115.03724

# --- New waypoint ------------------------------------------------------------------
# The guide opens on its Map pane; the ＋ FAB is labelled "Add a waypoint".
- extendedWaitUntil:
    visible: "Add a waypoint"
    timeout: 20000
- tapOn: "Add a waypoint"
- extendedWaitUntil:
    visible: "Save waypoint"
    timeout: 15000
- assertVisible: "New waypoint"
- assertVisible: "No position yet.*"

# The "Name" label shares the field's accessible name: select it by testID.
- tapOn:
    id: "waypoint-edit-name"
- inputText: "Maestro spring"
- hideKeyboard
- tapOn: "Water source"

# GPS: the first tap starts it and asks for permission (Android's prompt reads
# "While using the app" / "Only this time" / "Don't allow").
- tapOn: "Use my location"
- extendedWaitUntil:
    visible: "(?i)while using the app"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "(?i)while using the app"
    commands:
      - tapOn: "(?i)while using the app"
# Once a fix is in, a tap copies it into the form, and the position line reads
# "At <km> along the trail, on the trail".
- repeat:
    while:
      notVisible: "At .* along the trail, .*"
    times: 10
    commands:
      - tapOn: "Use my location"
      - extendedWaitUntil:
          visible: "At .* along the trail, .*"
          timeout: 3000
          optional: true
- assertVisible: "At .* along the trail, .*"
- assertVisible: "Kept on this phone only. Nobody else sees it."

- scrollUntilVisible:
    element:
      text: "Save waypoint"
    direction: DOWN
    timeout: 15000
- tapOn: "Save waypoint"

# --- It lists like any waypoint ----------------------------------------------------
# Saving goes back to the guide; the hiker waypoint is placed on the trail and
# its List pane row is "Open Maestro spring" plus any off-trail suffix.
- extendedWaitUntil:
    visible: "Elevation"
    timeout: 15000
- tapOn: "List"
- scrollUntilVisible:
    element:
      text: "Open Maestro spring.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Open Maestro spring.*"
- extendedWaitUntil:
    visible: "Added by you · only on this phone"
    timeout: 20000

# --- Edit: rename it ----------------------------------------------------------------
- tapOn: "Edit waypoint"
- extendedWaitUntil:
    visible: "Save waypoint"
    timeout: 15000
- tapOn:
    id: "waypoint-edit-name"
- eraseText: 30
- inputText: "Maestro spring edited"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Save waypoint"
    direction: DOWN
    timeout: 15000
- tapOn: "Save waypoint"
# Saving an edit goes back to the waypoint's own screen, now renamed.
- extendedWaitUntil:
    visible: "Maestro spring edited"
    timeout: 15000
- assertVisible: "Added by you · only on this phone"
- takeScreenshot: hiker-waypoint-edit

# --- Delete -------------------------------------------------------------------------
- tapOn: "Edit waypoint"
- scrollUntilVisible:
    element:
      id: "waypoint-edit-delete"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "waypoint-edit-delete"
# A native confirm (`Alert.alert`): "Delete waypoint?" with Cancel / Delete.
# Android may draw the buttons in capitals, hence the case-insensitive match.
- extendedWaitUntil:
    visible: "Delete waypoint\\?"
    timeout: 10000
- tapOn: "(?i)delete"
# Deleting dismisses to the guide, which was left on its List pane.
- extendedWaitUntil:
    visible: "Elevation"
    timeout: 15000
- assertNotVisible: "Open Maestro spring.*"
