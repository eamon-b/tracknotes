appId: com.tracknotes.app
---
# The waypoint screen's alternate card (`WaypointAlternateCard`) — List pane →
# a junction place → the card → "Take this alternate" / "Stay on the main
# route" round-trip (the plan edit `setAlternate` makes).
#
# Cape to Cape's Margaret River Detour (9.6 km) is a plannable alternate: it
# leaves the main route at km 62.9 and rejoins it at km 66.0, where Kilcarnup
# Beach Start sits (within `JUNCTION_KM` of the rejoin), so that place's screen
# carries a "rejoins" card. No named place is within reach of the km-62.9
# junction, so the card's "Leaves the main route at" line is plain text, not a
# link. Asserts no distances, which move with the data.
- runFlow: shared/launch-dev.yaml
- runFlow: shared/open-cape-to-cape.yaml

- tapOn: "List"
- extendedWaitUntil:
    visible: "Cape Leeuwin Lighthouse"
    timeout: 20000
# "Open Kilcarnup Beach Start (2.1km)" plus any off-trail suffix; the ".*"
# avoids escaping the parentheses (Maestro matches a full-string regex).
- scrollUntilVisible:
    element:
      text: "Open Kilcarnup Beach Start.*"
    direction: DOWN
    timeout: 40000
- tapOn: "Open Kilcarnup Beach Start.*"
- waitForAnimationToEnd

# --- The card -------------------------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "Take this alternate: Margaret River Detour"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*An alternate rejoins the main route here: Margaret River Detour"
- assertVisible: "Leaves the main route at .*"
- assertVisible: "Your plan stays on the main route here."
- takeScreenshot: waypoint-alternate

# --- Take it, then go back to the main route ----------------------------------------
- tapOn: "Take this alternate: Margaret River Detour"
- extendedWaitUntil:
    visible: "Stay on the main route: Margaret River Detour"
    timeout: 10000
- assertVisible: "Your plan takes this alternate."
- tapOn: "Stay on the main route: Margaret River Detour"
- extendedWaitUntil:
    visible: "Take this alternate: Margaret River Detour"
    timeout: 10000
- assertVisible: "Your plan stays on the main route here."

# Back returns to the guide's List pane.
- pressKey: back
- extendedWaitUntil:
    visible: "Open Kilcarnup Beach Start.*"
    timeout: 15000
