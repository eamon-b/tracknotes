appId: com.tracknotes.app
---
# Shared fragment: open the Cape to Cape guide from My Guides.
#
# Run after `shared/launch-dev.yaml`. Flows use Cape to Cape (127 km, one of
# the smallest bundled trails) so trail load and profile work stay fast.
# My Guides is grouped (Hiking now → countries → Community → Imported), and
# within Australia by state, so Cape to Cape (WA) sits below the fold: scroll
# to it. Kept in one place so a change to My Guides' layout is fixed once.
- scrollUntilVisible:
    element:
      text: "Cape to Cape Track"
    direction: DOWN
    timeout: 20000
- tapOn: "Cape to Cape Track"

# Wait for the guide's three-pane shell (Map | Elevation | List) to load.
- extendedWaitUntil:
    visible: "Elevation"
    timeout: 30000
