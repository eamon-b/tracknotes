<!--
  The plan page's markup — the header bar and the three-panel body — in one
  copy.

  Three pages render the same planner: `plan-template.html`, which
  `scripts/build-trails.ts` turns into `src/web/trails/<id>/plan.html` for each
  bundled trail, `my-plan.html`, the planner for a GPX the user imported, and
  `shared-plan.html`, the read-only view of a plan someone shared a link to.
  Everything from `<div id="plan-shell">` to its closing tag lives here, and
  each of those pages carries an `@plan-shell` marker comment on a line of its
  own where it goes. `generatePlanPage` in `scripts/build-trails.ts` inlines
  it into the template (before its own `{{...}}` substitution); the
  `plan-shell` plugin in `vite.config.ts` inlines it into `my-plan.html` and
  `shared-plan.html` at dev/build time.

  The headers differ in a few small ways, and the shell carries two
  placeholders for them rather than a third copy of the header:

    {{PLAN_HEADER_TRAIL}}  the back link and the trail title. A bundled page
                           links to `index.html` and has the name substituted
                           in as `{{TRAIL_NAME}}`; `my-plan.html` needs
                           `id`-bearing elements, because the name and the
                           href are only known once `my-plan.ts` has read the
                           trail out of IndexedDB.
    {{PLAN_HEADER_EXTRA}}  the theme toggle, which only the bundled pages have
                           (`my-plan.html` loads no `theme.ts`). Empty there;
                           on `shared-plan.html` it is the "Shared by" line and
                           the two actions a shared plan offers.
    {{PLAN_SYNC_DIALOGS}}  the link dialog and the share panel, the same on
                           every page; the markup is in `plan-sync-markup.ts`
                           because the resupply page mounts it too.

  Placeholders beat keeping the differing lines in the page files: doing that
  would split `#plan-header` across two files again and put its open and close
  tags back in both — the duplication this file exists to remove. Both fills,
  and the inliner itself, live in `scripts/lib/plan-shell.ts`, which the build
  script, the Vite plugin and the tests that boot this markup all call.

  Only the `<div id="plan-shell">` line onwards is inlined, so this comment
  stays out of the generated pages.
-->
  <div id="plan-shell">
    <!-- Header bar -->
    <div id="plan-header">
      {{PLAN_HEADER_TRAIL}}
      <input type="text" id="plan-name-input" placeholder="Plan name…" maxlength="80" />
      <div id="plan-date-group">
        <label for="plan-start-date" style="font-size:0.875rem;">Start:</label>
        <input type="date" id="plan-start-date" />
      </div>
      <div id="plan-pace-group">
        <label for="plan-pace">Pace:</label>
        <select id="plan-pace"></select>
        <label for="plan-daily-hours">Hours/day:</label>
        <input type="number" id="plan-daily-hours" min="1" max="16" step="1" />
      </div>
      <button type="button" id="direction-toggle" title="Toggle hiking direction">
        <span class="direction-arrows" aria-hidden="true">⇄</span>
        <span id="direction-label">NOBO</span>
      </button>
      <span id="save-status">Saved</span>
      <span id="sync-status" hidden></span>
      <button type="button" id="sync-btn" class="plan-header-btn" hidden>Sync</button>
      <button type="button" id="share-btn" class="plan-header-btn" hidden>Share</button>
      {{PLAN_HEADER_EXTRA}}
    </div>

    <!--
      Linking this browser to the phone's account, and the share link: one copy
      in `src/web/trails/plan-sync-markup.ts`, filled in here by
      `inlinePlanShell` and mounted at runtime by the resupply page. Both are
      removed outright by `plan-sync.ts` when the site was built without
      VITE_API_BASE_URL, so an unconfigured build has no dead controls in it.
    -->
    {{PLAN_SYNC_DIALOGS}}

    <!-- Three-panel body -->
    <div id="plan-body">

      <!-- Left panel -->
      <div id="left-panel">
        <div id="left-tabs">
          <button class="tab-btn active" data-tab="days">Days</button>
          <button class="tab-btn" data-tab="stops">Stops</button>
          <button class="tab-btn" data-tab="resupply">Resupply</button>
        </div>

        <!-- Days tab -->
        <div id="tab-days" class="tab-panel active">
          <!-- Ranked suggestions for the next few nights (plan-next-days.ts). -->
          <div class="collapse-section" id="next-days-section">
            <div class="collapse-header" data-collapse="next-days">
              Plan the next few days <span class="collapse-chevron open">▶</span>
            </div>
            <div class="collapse-body open" id="next-days-body"></div>
          </div>

          <div id="days-list">
            <p class="days-empty">Add stops in the Stops tab to build your day plan.</p>
          </div>

          <!-- Resupply section -->
          <div class="collapse-section" id="resupply-section" hidden>
            <div class="collapse-header" data-collapse="resupply">
              Resupply <span class="collapse-chevron open">▶</span>
            </div>
            <div class="collapse-body open" id="resupply-body"></div>
          </div>

          <!-- Water carry section -->
          <div class="collapse-section" id="water-section" hidden>
            <div class="collapse-header" data-collapse="water">
              Water carry <span class="collapse-chevron open">▶</span>
            </div>
            <div class="collapse-body open" id="water-body">
              <div class="plan-thresholds">
                <label for="plan-dry-stretch">Flag a carry as dry from</label>
                <input type="number" id="plan-dry-stretch" inputmode="numeric" />
                <span>km</span>
              </div>
              <div id="water-gaps"></div>
            </div>
          </div>
        </div>

        <!-- Stops tab -->
        <div id="tab-stops" class="tab-panel">
          <div id="stops-search">
            <input type="text" id="stops-filter" placeholder="Filter waypoints…" autocomplete="off" />
            <label id="stops-show-all-label">
              <input type="checkbox" id="stops-show-all" />
              Show all waypoints
            </label>
          </div>
          <div id="stops-list"></div>
          <!-- Where the service glyphs come from, or that this trail has none. -->
          <div id="stops-footer" class="stops-footer"></div>
        </div>

        <!-- Resupply tab -->
        <div id="tab-resupply" class="tab-panel">
          <div id="resupply-controls">
            <div id="resupply-controls-row">
              <span id="resupply-count"></span>
              <button type="button" class="resupply-btn" id="resupply-all">All</button>
              <button type="button" class="resupply-btn" id="resupply-none">None</button>
            </div>
            <div class="plan-thresholds">
              <label for="plan-food-grams">Food per day</label>
              <input type="number" id="plan-food-grams" inputmode="numeric" />
              <span>g</span>
              <label for="plan-long-carry">Long carry over</label>
              <input type="number" id="plan-long-carry" inputmode="numeric" />
              <span>days</span>
            </div>
            <input type="text" id="resupply-filter" placeholder="Filter resupply…" autocomplete="off" />
            <!-- Shown by the viewer when the page has a resupply planner (PlanViewerOptions.resupplyPageHref). -->
            <a id="resupply-page-link" class="resupply-page-link" href="#" hidden>Open the resupply planner →</a>
          </div>
          <div id="resupply-list"></div>
        </div>
      </div>

      <!-- Center panel -->
      <div id="center-panel">
        <div id="plan-map"></div>
        <div id="elevation-section">
          <canvas id="elevation-canvas"></canvas>
          <div id="elev-hover-line"></div>
          <div id="elev-hover-tooltip"></div>
        </div>
      </div>

      <!-- Right panel -->
      <div id="right-panel">
        <div id="datasheet-header">
          <p id="datasheet-title">All waypoints</p>
          <p id="datasheet-subtitle"></p>
        </div>
        <div id="datasheet-body"></div>
      </div>

    </div><!-- #plan-body -->
  </div><!-- #plan-shell -->
