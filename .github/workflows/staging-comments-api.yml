name: Staging comments API (build)

# The first half of the staging deploy (docs/architecture/workers.md,
# "staging"): it bundles a PR's workers/comments-api/ and hands the bundle and
# the migration SQL to staging-comments-api-deploy.yml as an artifact.
#
# This half runs the branch's code, so it holds NO secrets and names no
# environment. A branch can make the bundler read any file on the runner (a
# symlink to /proc/self/environ imported as text is enough), so whatever is in
# this job's environment can end up inside the Worker; here that is nothing.
# The deploy half holds the staging token, always runs main's copy of its own
# workflow file (workflow_run), and treats the artifact as data: it uploads the
# bundle with --no-bundle and applies the SQL, both with main's [env.staging].

on:
  pull_request:
    paths:
      - workers/comments-api/**
      # The worker bundles @lib (as the production deploy's filter knows).
      - src/lib/**
      - .github/workflows/staging-comments-api.yml
      - .github/workflows/staging-comments-api-deploy.yml
  # Any branch: Actions → Staging comments API (build) → Run workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Same-repo PRs only (the deploy half checks this again, from main's copy)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: workers/comments-api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/comments-api/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The same bundle `wrangler deploy --env staging` would upload, written
      # out instead (no account or token needed)
      - name: Bundle
        run: npx wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/bundle"
      - name: Collect the bundle and migrations
        run: |
          out="$RUNNER_TEMP/staging"
          mkdir -p "$out/bundle" "$out/migrations"
          cp "$RUNNER_TEMP/bundle/index.js" "$out/bundle/"
          cp migrations/*.sql "$out/migrations/"
          ls -l "$out/bundle" "$out/migrations"
      - uses: actions/upload-artifact@v7
        with:
          name: staging-comments-api
          path: ${{ runner.temp }}/staging/
          if-no-files-found: error
          retention-days: 3
