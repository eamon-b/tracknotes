name: Deploy comments API

# Deploys workers/comments-api/ from main after every merge that can change it:
# remote D1 migrations first, then `wrangler deploy`, then the route probes
# (scripts/probe-comments-api.sh). Shipped app builds call this API, so a merge
# that sat undeployed lost their writes to routes that 404 (#141).
# Runbook and setup (the `production` environment and its token): docs/deploys.md.

on:
  push:
    branches: [main]
    paths:
      - workers/comments-api/**
      # The worker bundles @lib (validation, community checks, POIs)
      - src/lib/**
  workflow_dispatch:

# One deploy at a time, in merge order. A newer queued run replaces an older
# queued one, which is fine: the newer main includes it.
concurrency:
  group: deploy-comments-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Always deploy main as it is now, not the commit that started the run: a run
  # that waited behind another, or a re-run of an old one, then deploys the newest
  # code rather than putting older code back, and a newer commit that did not touch
  # the trigger paths (so started no run) cannot leave this one undeployed.
  head:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - id: head
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head since $GITHUB_SHA: deploying $head."
          fi

  deploy:
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.tracknotes.info/health
    defaults:
      run:
        shell: bash
        working-directory: workers/comments-api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/comments-api/package-lock.json
      # The token is passed only to the steps that call Cloudflare, not to npm ci or the tests
      - run: npm ci
      # The Tests workflow's checks, so a deploy neither waits on that run nor races it
      - run: npm test
      - run: npx tsc --noEmit
      # Migrations apply before the deploy, while the old worker is still serving,
      # so each must be additive (expand, then contract in a later release:
      # docs/architecture/workers.md). One that drops or renames anything (a
      # SQLite table rebuild does both) is refused here and applied by hand.
      - name: Migrations to apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          list=$(npx wrangler d1 migrations list DB --remote 2>&1)
          echo "$list"
          destructive=()
          for name in $(grep -oE '[0-9]{4}_[A-Za-z0-9_]+\.sql' <<<"$list" | sort -u); do
            if sed 's/--.*$//' "migrations/$name" | grep -qiE '\b(drop|rename)\b'; then destructive+=("$name"); fi
          done
          if [ "${#destructive[@]}" -gt 0 ]; then
            echo "::error::${destructive[*]} drops or renames something, which can break the worker still running until the deploy. Apply it by hand (docs/deploys.md), then re-run this workflow."
            exit 1
          fi
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run migrate:remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Probe the routes
        working-directory: .
        run: |
          { echo '### Route probes'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          scripts/probe-comments-api.sh | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
