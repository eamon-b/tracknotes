name: Upload waypoint descriptions

# Pushes curated waypoint descriptions (data/trails/<trail>/descriptions.json)
# to the comments API (`npm run upload:descriptions`), so installed apps get the
# text over the sync channel, after a merge that changes one. The run sends only
# the difference from the live set, and withdraws a description a file no longer
# lists. Phones pick it up, so it waits for a reviewer: the `plan` job's dry run
# is in its summary, and `upload` runs once someone approves `production-data`.
# A line marked `!` in the plan, and its warning, is a live edit made on
# admin-descriptions.html that the file does not match: docs/waypoint-editor.md.
# `upload` undoes only the live edits that plan showed, and no write replaces a
# row that changed after it was read: a run that was refused a row is red.
# Setup: docs/deploys.md.

on:
  push:
    branches: [main]
    paths:
      - data/trails/*/descriptions.json
  workflow_dispatch:

concurrency:
  group: upload-descriptions
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRACKNOTES_API_BASE_URL: https://api.tracknotes.info

jobs:
  # The dry run reads the live set (public, no token) and prints exactly what
  # would be sent and withdrawn. It plans main as it is now, not the commit that
  # started the run, so a run that waited cannot skip a merge or send older text;
  # `upload` then sends exactly the commit planned here.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upload: ${{ steps.plan.outputs.upload }}
      sha: ${{ steps.head.outputs.sha }}
      # The live edits and clears the plan showed (its `!` lines), for `upload`.
      acknowledged: ${{ steps.plan.outputs.acknowledged }}
    defaults:
      run:
        shell: bash
    steps:
      - id: head
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head since $GITHUB_SHA: planning $head."
            echo "Planning \`${head:0:7}\`, main's head, not \`${GITHUB_SHA:0:7}\`, which started this run (main has moved on since)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Planning \`${head:0:7}\`, main's head." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.head.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: plan
        env:
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          out="$RUNNER_TEMP/plan.txt"
          shown="$RUNNER_TEMP/live-shown.json"
          npm run -s upload:descriptions -- --dry-run --record-live "$shown" 2>&1 | tee "$out"
          { echo "### Upload plan for ${SHA:0:7}"; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Nothing to send, withdraw or mark (a committed live edit is re-sent to
          # mark it uploaded): the script's summary line, kept in step with it.
          if grep -q 'would have 0 description(s) sent, 0 withdrawn, 0 committed live edit(s) marked' "$out"; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
          # What the plan showed of live edits: per trail, the waypoint id and the
          # row's timestamp, as one line of JSON the script wrote from values it
          # checked. `upload` is given it back, so it undoes those and no other.
          # Nothing else may reach a job output: one line, ids and timestamps
          # only, and far under the 1 MB an output holds (about 45 bytes a row).
          if [ "$(wc -l < "$shown")" -ne 1 ] || [ "$(wc -c < "$shown")" -gt 500000 ] ||
            ! grep -Eqx '[{}":,.0-9A-Za-z_-]+' "$shown"; then
            echo "::error::The plan's list of live edits is not one line of ids and timestamps under 500 kB, so it was not passed on."
            exit 1
          fi
          echo "acknowledged=$(cat "$shown")" >> "$GITHUB_OUTPUT"

  upload:
    needs: plan
    if: needs.plan.outputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-data
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Re-reads the live set, so it sends the difference as it is now, except
      # over a live edit the plan did not show (made since, or changed since):
      # that row is left as it is, the rest are sent, and the step fails (exit
      # 2). Each write also names the row it read, so the API refuses one over a
      # row that changed meanwhile. The plan's list reaches the shell only as an
      # environment variable, never as text in this script.
      - name: Upload
        shell: bash
        env:
          TRACKNOTES_ADMIN_TOKEN: ${{ secrets.TRACKNOTES_ADMIN_TOKEN }}
          ACKNOWLEDGED_LIVE: ${{ needs.plan.outputs.acknowledged }}
        run: |
          shown="$RUNNER_TEMP/live-shown.json"
          printf '%s\n' "$ACKNOWLEDGED_LIVE" > "$shown"
          npm run -s upload:descriptions -- --acknowledged-live "$shown"
