name: Moderation queue

# Daily: are reported or flagged posts waiting for an admin? The run fails while
# any are, and GitHub emails a failed scheduled run to whoever last changed its
# schedule, so the alert reaches the maintainer privately. The repository is
# public, and so are its issues; this posts nowhere. The run summary (public, but
# nobody is notified of it) carries counts only, never post text or names
# (scripts/moderation-queue.ts). The decisions stay on the moderation page.
# Setup: docs/deploys.md.

on:
  schedule:
    - cron: '13 22 * * *'
  workflow_dispatch:

concurrency:
  group: moderation-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The admin token lives in its own environment, `moderation` (main only, no
    # reviewer, nothing else in it), not in `production`, whose deploy jobs run on
    # every merge. And no package is installed: the script runs on Node's type
    # stripping with only built-ins and src/lib, so no dependency's code runs
    # while the token is in the environment.
    environment:
      name: moderation
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: queue
        env:
          TRACKNOTES_ADMIN_TOKEN: ${{ secrets.TRACKNOTES_ADMIN_TOKEN }}
        run: node scripts/moderation-queue.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail while posts are waiting
        env:
          COUNT: ${{ steps.queue.outputs.count }}
        run: |
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT reported or flagged post(s) are waiting on https://tracknotes.info/admin-moderation.html"
            exit 1
          fi
