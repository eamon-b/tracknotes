name: Publish trail data

# Publishes the app's trail data over the air (`npm run publish:trail-data`,
# runbook docs/trail-data-updates.md) after a merge that changes the committed
# mobile/assets/trails/. Every installed app picks a publish up, so it waits for
# a reviewer: the `plan` job's dry run is in its summary, and the `publish` job
# runs once someone approves the `production-data` environment.
# Setup: docs/deploys.md.

on:
  push:
    branches: [main]
    paths:
      - mobile/assets/trails/**
  workflow_dispatch:
    inputs:
      hold:
        description: 'Trail ids to leave as they are live (space-separated; --hold)'
        type: string
        default: ''

concurrency:
  group: publish-trail-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The dry run, with no credentials: what would be uploaded, and every refusal
  # (a rollback, a stale checkout, a dropped trail) before anyone is asked
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The stale-checkout guard needs the live catalog's sourceCommit in this history
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: plan
        env:
          HOLD: ${{ inputs.hold }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # An old or overtaken run is not published: the newer commit's run is
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head, past $GITHUB_SHA: that commit's run publishes. Nothing published here."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=()
          for id in $HOLD; do args+=(--hold "$id"); done
          out="$RUNNER_TEMP/plan.txt"
          npm run -s publish:trail-data -- --dry-run "${args[@]}" 2>&1 | tee "$out"
          { echo '### Publish plan'; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^Nothing to publish' "$out"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-data
      url: https://data.tracknotes.info/trails/v1/catalog.json
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The script re-runs every guard against the live catalog as it is now,
      # so an approval given late cannot publish over a newer publish
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOLD: ${{ inputs.hold }}
        run: |
          args=()
          for id in $HOLD; do args+=(--hold "$id"); done
          npm run -s publish:trail-data -- "${args[@]}"
      - name: Check the live catalog matches
        env:
          HOLD: ${{ inputs.hold }}
        run: |
          args=()
          for id in $HOLD; do args+=(--hold "$id"); done
          npm run -s publish:trail-data -- --check "${args[@]}"
