name: Dependency audit

# The monthly dependency check, alongside Dependabot (.github/dependabot.yml),
# which leaves Expo-managed packages alone: `npm audit` over every package
# (scripts/dependency-audit.ts, failing only on a high or critical advisory with
# a non-breaking fix), and the Expo SDK's own checks under mobile/. A red run is
# the reminder; its summary says what to do. Runbook: docs/deploys.md.

on:
  schedule:
    - cron: '23 4 3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run -s audit:deps | tee -a "$GITHUB_STEP_SUMMARY"

  # Expo pins each native package to the SDK; `npx expo install --fix` moves them
  # together, which Dependabot cannot do (mobile/CLAUDE.md)
  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: expo install --check
        run: |
          {
            echo '### `npx expo install --check`'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          npx expo install --check 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] || grep -q 'Found outdated dependencies' "$GITHUB_STEP_SUMMARY"; then
            echo 'Fix: `npx expo install --fix` in mobile/, then the device check in mobile/CLAUDE.md for native packages.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: expo-doctor
        if: ${{ !cancelled() }}
        run: |
          { echo '### `npx expo-doctor`'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          npx expo-doctor 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
