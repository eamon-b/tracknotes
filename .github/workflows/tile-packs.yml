name: Offline tile packs

# Every trail the app bundles gets a Download button, so every one must have a
# pack on the tile host. Runs when the bundled trail list changes (a new trail
# fails here until its pack is built and uploaded: build:tiles, upload:tiles)
# and weekly, to catch a pack that goes missing or bad on the server. The weekly
# run also checks the published over-the-air trail data matches main.

on:
  pull_request:
    paths:
      - mobile/assets/trails/index.json
      - scripts/e2e-tile-check.mjs
      - scripts/lib/http-mbtiles.mjs
      - scripts/lib/mvt-contours.mjs
  push:
    branches: [main]
    paths:
      - mobile/assets/trails/index.json
      - scripts/e2e-tile-check.mjs
      - scripts/lib/http-mbtiles.mjs
      - scripts/lib/mvt-contours.mjs
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  tile-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No npm ci: the check uses only Node built-ins.
      - run: npm run check:tile-packs

  # Did a trail data change reach main without `npm run publish:trail-data`? Not run on
  # pull requests or pushes, which change the data before it is published.
  # Reads the public catalog only, no credentials (docs/trail-data-updates.md).
  published-trail-data:
    # main only: the live catalog tracks main, so a branch with rebuilt data would differ
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run publish:trail-data -- --check
