name: Offline tile packs

# Every trail the app bundles gets a Download button, so every one must have a
# pack on the tile host. Runs when the bundled trail list changes (a new trail
# fails here until its pack is built and uploaded: build:tiles, upload:tiles)
# and weekly, to catch a pack that goes missing or bad on the server. The weekly
# (and manual) run is every check in e2e-tile-check.mjs: also the contour
# Worker's /health (sources.world.ok, maxZoom 15), tile decode, z14/z15 tiles
# and the contours alias, all read-only GETs to the public hosts. It also checks
# the published over-the-air trail data matches main.

on:
  pull_request:
    paths:
      - mobile/assets/trails/index.json
      - scripts/e2e-tile-check.mjs
      - scripts/lib/http-mbtiles.mjs
      - scripts/lib/mvt-contours.mjs
      - .github/workflows/tile-packs.yml
      - package.json
  push:
    branches: [main]
    paths:
      - mobile/assets/trails/index.json
      - scripts/e2e-tile-check.mjs
      - scripts/lib/http-mbtiles.mjs
      - scripts/lib/mvt-contours.mjs
      - .github/workflows/tile-packs.yml
      - package.json
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Read-only: both jobs read public hosts and the checkout, nothing else.
permissions:
  contents: read

jobs:
  tile-packs:
    runs-on: ubuntu-latest
    # Above the tiered pack reads' own 6-minute budget (TIERED_PACKS_BUDGET_MS)
    # plus the other checks, so a slow run ends in its RESULT block, not a kill.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No npm ci: the check uses only Node built-ins.
      - run: npm run check:tile-packs
        if: github.event_name == 'pull_request' || github.event_name == 'push'
      - name: Every tile check (weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/e2e-tile-check.mjs

  # Did a trail data change reach main without `npm run publish:trail-data`? Not run on
  # pull requests or pushes, which change the data before it is published.
  # Reads the public catalog only, no credentials (docs/trail-data-updates.md).
  published-trail-data:
    # main only: the live catalog tracks main, so a branch with rebuilt data would differ
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run publish:trail-data -- --check
