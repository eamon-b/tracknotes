name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc otherwise runs only inside `npm run build`, which CI never runs.
      # Before the tests, so a failing test cannot hide a type error.
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run lint

  # The generated trail data is committed (mobile/assets/trails/, data/waypoint-ids.json),
  # so a change to the build or the source data must ship with its rebuilt output.
  # No network: build:trails reads the committed climate.json and pois.json.
  trail-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Te Araroa's GPX is gitignored and copied out of the te-araroa-data package
      - run: npm run sync:te-araroa
      - run: npm run build:trails
      - run: npm run build:mobile-trails
      - name: Check the committed trail data is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "::error::The committed trail data is stale. Run npm run sync:te-araroa, build:trails and build:mobile-trails, and commit the result."
            exit 1
          fi

  comments-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/comments-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/comments-api/package-lock.json
      - run: npm ci
      - run: npm test
      # The pool-workers runner strips types without checking them, and the root tsc
      # does not include workers/: this is what catches a change to a shared src/lib type
      - run: npx tsc --noEmit

  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # React Native 0.86 (Expo SDK 57) declares
          # node ^20.19.4 || ^22.13.0 || ^24.3.0 || >= 25. Plain "20" floats to
          # whatever 20.x the runner has, which can land below that floor.
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run typecheck
      - run: npm run lint
