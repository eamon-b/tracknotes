name: Deploy contours site

# Deploys contours/site/ (the public contour dataset's docs and demo page) to
# Cloudflare Pages, project `aus-contour-tiles` (contour-map-tiles.net), after a
# merge that changes it. Runbook and setup: docs/deploys.md.

on:
  push:
    branches: [main]
    paths:
      - contours/site/**
  workflow_dispatch:

concurrency:
  group: deploy-contours-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # As in Deploy comments API: deploy main as it is now, not the commit that
  # started the run, so no merge is left undeployed and no older page goes back
  head:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - id: head
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head since $GITHUB_SHA: deploying $head."
          fi

  deploy:
    needs: head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://contour-map-tiles.net
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.head.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # wrangler is a root devDependency
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ needs.head.outputs.sha }}
        # `main` is the project's production branch
        run: npx wrangler pages deploy contours/site --project-name aus-contour-tiles --branch main --commit-hash "$SHA"
      - name: Check the page answers
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://contour-map-tiles.net/)
            if [ "$code" = 200 ]; then echo "ok   200 https://contour-map-tiles.net/"; exit 0; fi
            sleep 10
          done
          echo "::error::https://contour-map-tiles.net/ answered $code"
          exit 1
